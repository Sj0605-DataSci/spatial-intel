topic: Shopping Mall Adventure
objective: Collect all items on the shopping list and participate in mall events to
  increase reputation.
environment_description: A lively and expansive shopping mall featuring vibrant store
  displays, bustling food courts, event stages, and interactive escalators. Decorations
  include colorful banners and an ambient atmosphere filled with the chatter of shoppers.
domain:
- name: Sam
  image_prompt: A stylish young adult equipped with a shopping cart and a list, ready
    to tackle mall challenges with enthusiasm.
- name: SecurityGuard
  image_prompt: An approachable security guard in uniform, assisting and providing
    guidance to shoppers in the mall.
- name: ChefMaria
  image_prompt: A lively chef standing amidst a well_stocked food court, offering
    cooking challenges to eager visitors.
- name: EventManagerAlex
  image_prompt: An energetic event manager orchestrating mall_wide events, juggling
    schedules and interacting with participants.
- name: ShoppersGroup
  image_prompt: A diverse group of shoppers, mingling and sharing their own quests
    while engaged in jovial interactions.
- name: ShoppingList
  image_prompt: A checklist of specific items, including electronics and fashion accessories,
    essential for completing the mall journey.
classes:
- class_name: Player
  list_of_objects:
  - Sam
- class_name: MallStaff
  list_of_objects:
  - SecurityGuard
  - ChefMaria
  - EventManagerAlex
- class_name: MallShoppers
  list_of_objects:
  - ShoppersGroup
- class_name: MallObjectives
  list_of_objects:
  - ShoppingList
state_of_objects:
- class_name: Player
  isMovable: true
- class_name: MallStaff
  isMovable: false
- class_name: MallShoppers
  isMovable: false
- class_name: MallObjectives
  isMovable: false
state_variables:
- name: items_collected
  type: integer
- name: events_participated
  type: integer
- name: reputation_score
  type: integer
- name: list_completed
  type: bool
actions:
- name: CollectItem(Player, MallObjectives)
- name: EngageEvent(Player, MallStaff)
- name: Interact(Player, MallShoppers)
- name: NavigateEscalator(Player, MallStaff)
transitions:
- action: CollectItem(?Player, ?MallObjectives)
  preconditions:
  - items_collected < 5
  - ?Player.x == ?MallObjectives.x
  - ?Player.y == ?MallObjectives.y
  effects:
  - items_collected = items_collected + 1
  side_effects:
  - ShowText(true, 'Item collected!')
  - MoveImage(?MallObjectives, ?MallObjectives.x, ?MallObjectives.y, HIDDEN, HIDDEN)
- action: EngageEvent(?Player, ?MallStaff)
  preconditions:
  - events_participated < 3
  - ?Player.x == ?MallStaff.x
  - ?Player.y == ?MallStaff.y
  effects:
  - events_participated = events_participated + 1
  side_effects:
  - ShowText(true, 'Participated in event!')
- action: Interact(?Player, ?MallShoppers)
  preconditions:
  - reputation_score < 15
  - ?Player.x == ?MallShoppers.x
  - ?Player.y == ?MallShoppers.y
  effects:
  - reputation_score = reputation_score + 1
  side_effects:
  - ShowText(true, 'Gained reputation through interaction!')
- action: NavigateEscalator(?Player, ?MallStaff)
  preconditions:
  - items_collected == 5
  - events_participated == 3
  - ?Player.x == ?MallStaff.x
  - ?Player.y == ?MallStaff.y
  - reputation_score >= 5
  effects:
  - list_completed = true
  - reputation_score = 2 * reputation_score
  side_effects:
  - ShowText(true, 'Navigated escalator, boosted reputation!')
goal: items_collected == 5 AND events_participated == 3 AND list_completed
reward: items_collected + events_participated * 2 + reputation_score
max_reward: 33
grid_size:
  x_size: 7
  y_size: 7
initial_state_objects:
- domain_object: Sam
  x: '1'
  y: '1'
- domain_object: SecurityGuard
  x: '2'
  y: '1'
- domain_object: ChefMaria
  x: '3'
  y: '2'
- domain_object: EventManagerAlex
  x: '1'
  y: '3'
- domain_object: ShoppersGroup
  x: '4'
  y: '2'
- domain_object: ShoppingList
  x: '2'
  y: '3'
initial_state_variables:
- name: items_collected
  value: 0
- name: events_participated
  value: 0
- name: reputation_score
  value: 0
- name: list_completed
  value: false
